name: Evening next-day astrology message

on:
  workflow_dispatch:

  schedule:
    - cron: "00 21 * * *"
      timezone: "Australia/Melbourne"

permissions:
  contents: read

jobs:
  send-evening-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install packages
        run: python -m pip install -r requirements.txt

      - name: Generate and send tomorrow's reading
        env:
          READING_MODE: evening

          FREEASTRO_API_KEY: ${{ secrets.FREEASTRO_API_KEY }}

          BIRTH_YEAR: ${{ secrets.BIRTH_YEAR }}
          BIRTH_MONTH: ${{ secrets.BIRTH_MONTH }}
          BIRTH_DAY: ${{ secrets.BIRTH_DAY }}
          BIRTH_HOUR: ${{ secrets.BIRTH_HOUR }}
          BIRTH_MINUTE: ${{ secrets.BIRTH_MINUTE }}
          BIRTH_CITY: ${{ secrets.BIRTH_CITY }}
          BIRTH_TIMEZONE: ${{ secrets.BIRTH_TIMEZONE }}
          BIRTH_TIME_KNOWN: ${{ secrets.BIRTH_TIME_KNOWN }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: python horoscope.py