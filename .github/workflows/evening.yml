name: Evening next-day astrology and calendar advice

on:
  workflow_dispatch:

  schedule:
    - cron: "30 20 * * *"
      timezone: "Australia/Melbourne"

permissions:
  contents: read

jobs:
  send-evening-advice:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install packages
        run: python -m pip install -r requirements.txt

      - name: Generate and send evening advice
        env:
          READING_MODE: evening

          FREEASTRO_API_KEY: ${{ secrets.FREEASTRO_API_KEY }}

          BIRTH_YEAR: ${{ secrets.BIRTH_YEAR }}
          BIRTH_MONTH: ${{ secrets.BIRTH_MONTH }}
          BIRTH_DAY: ${{ secrets.BIRTH_DAY }}
          BIRTH_HOUR: ${{ secrets.BIRTH_HOUR }}
          BIRTH_MINUTE: ${{ secrets.BIRTH_MINUTE }}
          BIRTH_CITY: ${{ secrets.BIRTH_CITY }}
          BIRTH_TIMEZONE: ${{ secrets.BIRTH_TIMEZONE }}
          BIRTH_TIME_KNOWN: ${{ secrets.BIRTH_TIME_KNOWN }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          CALENDAR_LABEL_1: ${{ secrets.CALENDAR_LABEL_1 }}
          CALENDAR_ICAL_URL_1: ${{ secrets.CALENDAR_ICAL_URL_1 }}

          CALENDAR_LABEL_2: ${{ secrets.CALENDAR_LABEL_2 }}
          CALENDAR_ICAL_URL_2: ${{ secrets.CALENDAR_ICAL_URL_2 }}

          CALENDAR_LABEL_3: ${{ secrets.CALENDAR_LABEL_3 }}
          CALENDAR_ICAL_URL_3: ${{ secrets.CALENDAR_ICAL_URL_3 }}

          CALENDAR_LABEL_4: ${{ secrets.CALENDAR_LABEL_4 }}
          CALENDAR_ICAL_URL_4: ${{ secrets.CALENDAR_ICAL_URL_4 }}

          CALENDAR_LABEL_5: ${{ secrets.CALENDAR_LABEL_5 }}
          CALENDAR_ICAL_URL_5: ${{ secrets.CALENDAR_ICAL_URL_5 }}

          INCLUDE_CALENDAR_LOCATIONS: "false"

        run: python horoscope.py